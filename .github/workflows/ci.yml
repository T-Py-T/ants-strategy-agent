name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pytest:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync project (all extras)
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest -v

  integration:
    name: Integration test (make test)
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync project
        run: uv sync --all-extras

      - name: Put uv venv on PATH
        # Prepend ./.venv/bin so the Makefile's bare `python3` invocations
        # resolve to the uv-managed interpreter that has the project deps.
        run: echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Run a real game (30 turns, 2 players) via make
        run: make test

  docker:
    name: Docker image builds and runs make test
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ants-strategy-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run make test inside container
        run: docker run --rm ants-strategy-agent:ci make test
