name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            docker:
              - Dockerfile
              - pyproject.toml
              - uv.lock
              - src/**

  pytest:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["3.13"]' || '["3.12", "3.13"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run unit tests (ci-local.sh)
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          RUN_UNIT_TESTS: "1"
          RUN_INTEGRATION: "0"
          RUN_DOCKER: "0"
        run: ./scripts/ci-local.sh

  integration:
    name: Integration test (make test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pytest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run integration test (ci-local.sh)
        env:
          RUN_UNIT_TESTS: "0"
          RUN_INTEGRATION: "1"
          RUN_DOCKER: "0"
        run: ./scripts/ci-local.sh

  docker:
    name: Docker image builds and runs make test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pytest, changes]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.docker == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ants-strategy-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run make test inside container
        run: docker run --rm ants-strategy-agent:ci make test
